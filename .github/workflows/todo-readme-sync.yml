name: todo-readme-sync

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run TODO README sync
        run: python3 .github/scripts/sync_todo_readme.py

      - name: Commit and push README update
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "NO README CHANGE"
          else
            git commit -m "docs: update Complete TODO List after dev TODO implementations"
            git push origin HEAD:dev
          fi
